version: "3"

services:
    app:
        build: .
        container_name: laravel_app
        expose:
            - "9000"
        volumes:
            - /home/nosa/studentmanagement-app:/var/www
        networks:
            - laravel_network
        depends_on:
            - db

    db:
        image: mysql:5.7
        container_name: laravel_db
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: stdmgtdb
            MYSQL_USER: nosa
            MYSQL_PASSWORD: nosa2907
        volumes:
            - /home/nosa/studentmanagement-app/mysql_data:/var/lib/mysql
        networks:
            - laravel_network

    nginx:
        image: nginx:alpine
        container_name: laravel_nginx
        ports:
            - "8000:80"
        volumes:
            - /home/nosa/studentmanagement-app:/var/www
            - /home/nosa/studentmanagement-app/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel_network

    prometheus:
        image: prom/prometheus
        container_name: prometheus
        ports:
            - "9090:9090"
        volumes:
            - /home/nosa/studentmanagement-app/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge

volumes:
    mysql_data:
