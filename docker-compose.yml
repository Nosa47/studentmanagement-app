version: "3"

services:
    app:
        build: .
        container_name: laravel_app
        ports:
            - "8000:9000"
        volumes:
            - .:/var/www
        networks:
            - laravel_network
        depends_on:
            - db

    db:
        image: mysql:5.7
        container_name: laravel_db
        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: laravel_db
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: laravel_password
        volumes:
            - mysql_data:/var/lib/mysql
        networks:
            - laravel_network

networks:
    laravel_network:
        driver: bridge

volumes:
    mysql_data:
